name: Build tetopkg packages

on:
  push:
    paths:
      - "srcpkgs/**/template"
  workflow_dispatch:
    inputs:
      pkgname:
        description: "Build satu paket spesifik (kosongkan untuk build semua yang berubah)"
        required: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          if [ -n "${{ github.event.inputs.pkgname }}" ]; then
            echo "packages=[\"${{ github.event.inputs.pkgname }}\"]" >> "$GITHUB_OUTPUT"
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              DIFF_RANGE="HEAD~1 HEAD"
            else
              # commit pertama, gak ada parent — anggap semua template sebagai "berubah"
              DIFF_RANGE="--root HEAD"
            fi
            CHANGED=$(git diff --diff-filter=d --name-only $DIFF_RANGE -- 'srcpkgs/*/template' \
              | sed -E 's#srcpkgs/([^/]+)/template#\1#' | sort -u | jq -R -s -c 'split("\n")[:-1]')
            if [ "$CHANGED" = "[]" ]; then
              # fallback terakhir: list semua srcpkgs yang ada
              CHANGED=$(find srcpkgs -maxdepth 1 -mindepth 1 -type d -exec basename {} \; | jq -R -s -c 'split("\n")[:-1]')
            fi
            echo "packages=${CHANGED}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.detect.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y p7zip-full jq

      - name: Download teto-pack
        run: |
          curl -L -o tetopkg-linux-x86_64.tar.gz \
            https://repository.eu.org/releases/tetopkg-linux-x86_64.tar.gz
          tar -xzf tetopkg-linux-x86_64.tar.gz
          chmod +x teto-pack

      - name: Build package
        run: |
          if [ -f "srcpkgs/${{ matrix.pkg }}/template" ]; then
            chmod +x tetopkg-src.sh
            ./tetopkg-src.sh "${{ matrix.pkg }}"
          else
            echo "::notice ::Template srcpkgs/${{ matrix.pkg }}/template was deleted; skipping build step."
          fi

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          pip install awscli --break-system-packages --quiet
          FILE=$(find build -name '*.tetopkg')
          aws s3 cp "$FILE" "s3://${{ secrets.R2_BUCKET }}/x86_64/packages/$(basename "$FILE")" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}"

  reindex:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y zstd tar
          pip install tomli_w awscli --break-system-packages --quiet

      - name: Rebuild repo index from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          mkdir -p repo/x86_64/packages
          aws s3 sync "s3://${{ secrets.R2_BUCKET }}/x86_64/packages/" repo/x86_64/packages/ \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}"

          python3 gen-index.py repo/x86_64/packages repo/x86_64/index.toml \
            "tetopkg-main" "Official tetopkg repository"

          aws s3 cp repo/x86_64/index.toml \
            "s3://${{ secrets.R2_BUCKET }}/x86_64/index.toml" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}"